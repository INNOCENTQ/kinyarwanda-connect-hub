her.</text><text x="112" y="380" fill="#18382b" font-family="Arial,sans-serif" font-size="66" font-weight="800">Plan with confidence.</text><text x="116" y="465" fill="#566c62" font-family="Arial,sans-serif" font-size="27">Check local forecasts, then make better-timed</text><text x="116" y="505" fill="#566c62" font-family="Arial,sans-serif" font-size="27">decisions for your crops and daily farm work.</text><g font-family="Arial,sans-serif"><circle cx="137" cy="586" r="19" fill="#dcebd6"/><path d="M129 586l6 7 12-15" fill="none" stroke="#54804d" stroke-width="4"/><text x="173" y="594" fill="#385647" font-size="22">Forecasts for your chosen place</text><circle cx="137" cy="642" r="19" fill="#dcebd6"/><path d="M129 642l6 7 12-15" fill="none" stroke="#54804d" stroke-width="4"/><text x="173" y="650" fill="#385647" font-size="22">Refresh when conditions change</text></g><text x="120" y="844" fill="#71816e" font-family="Arial,sans-serif" font-size="19">04  /  WEATHER THAT HELPS</text><text x="1440" y="844" fill="#71816e" font-family="Arial,sans-serif" font-size="19">04 — 06</text></svg>
