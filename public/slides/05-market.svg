<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Connect local harvests to opportunity</title><desc id="desc">A farmer-friendly marketplace brings agricultural listings, buyers and conversations together.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#192f37"/><stop offset="1" stop-color="#244c49"/></linearGradient><linearGradient id="fruit" x2="1" y2="1"><stop stop-color="#f1c96e"/><stop offset="1" stop-color="#e68c4d"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="1260" cy="420" r="280" fill="#d5ef83" opacity=".06"/><rect x="1000" y="240" width="430" height="390" rx="28" fill="#f8f4e8"/><path d="M1000 317h430v62h-430z" fill="#d5ef83"/><text x="1040" y="357" fill="#244532" font-family="Arial,sans-serif" font-size="22" font-weight="700">LOCAL MARKETPLACE</text><g transform="translate(1046 420)"><rect width="142" height="141" rx="18" fill="#e9efdb"/><circle cx="69" cy="58" r="35" fill="#eaa34f"/><path d="M68 20q5-23 27-17-1 18-27 21" fill="#548146"/><text x="20" y="122" fill="#365342" font-family="Arial,sans-serif" font-size="17" font-weight="700">Fresh produce</text><rect x="165" width="180" height="141" rx="18" fill="#e9efdb"/><path d="M196 60q20-25 46 0l-7 32h-35z" fill="#e3bf72"/><path d="M260 62q20-27 48 0l-7 30h-35z" fill="#b27a4b"/><text x="185" y="122" fill="#365342" font-family="Arial,sans-serif" font-size="17" font-weight="700">Livestock &amp; supplies</text></g><rect x="1050" y="580" width="320" height="38" rx="19" fill="#dce9d3"/><circle cx="1074" cy="599" r="9" fill="#56804d"/><text x="1094" y="605" fill="#365342" font-family="Arial,sans-serif" font-size="15">Ask sellers. Find what you need.</text><g transform="translate(920 560)"><circle cx="57" cy="27" r="28" fill="#e2ad75"/><path d="M12 126q4-66 46-66 44 0 50 66z" fill="#4d8060"/><circle cx="503" cy="27" r="28" fill="#bf8961"/><path d="M456 126q4-66 47-66 45 0 51 66z" fill="#d5ef83"/><path d="M113 82h337" stroke="#d5ef83" stroke-width="4" stroke-dasharray="12 13"/><circle cx="278" cy="82" r="31" fill="#d5ef83"/><path d="M261 81q0-17 17-17t17 17q0 12-17 25-17-13-17-25z" fill="#244532"/></g><text x="112" y="155" fill="#d5ef83" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">04 — MARKET &amp; CONNECTIONS</text><text x="112" y="300" fill="#fff9e9" font-family="Arial,sans-serif" font-size="66" font-weight="800">Connect local harvests</text><text x="112" y="380" fill="#fff9e9" font-family="Arial,sans-serif" font-size="66" font-weight="800">to opportunity.</text><text x="116" y="465" fill="#cbdccf" font-family="Arial,sans-serif" font-size="27">Bring buyers and sellers together around local</text><text x="116" y="505" fill="#cbdccf" font-family="Arial,sans-serif" font-size="27">produce, livestock and everyday farm needs.</text><g font-family="Arial,sans-serif" font-size="21"><rect x="116" y="568" width="240" height="63" rx="18" fill="#284c43" stroke="#67845e"/><text x="143" y="607" fill="#eff5dc">List your products</text><rect x="374" y="568" width="240" height="63" rx="18" fill="#284c43" stroke="#67845e"/><text x="405" y="607" fill="#eff5dc">Talk with buyers</text></g><text x="120" y="844" fill="#a4b9aa" font-family="Arial,sans-serif" font-size="19">05  /  LOCAL TRADE</text><text x="1440" y="844" fill="#a4b9aa" font-family="Arial,sans-serif" font-size="19">05 — 06</text></svg>
